[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-modelling-zigzag"
version = "0.1.0"
description = "Course project workspace for Zigzag Diffusion Sampling"
requires-python = ">=3.10,<3.11"
readme = "README.md"
dependencies = [
  "torch==2.12.0",
  "diffusers==0.37.1",
  "transformers==5.8.1",
  "accelerate>=0.27",
  "safetensors>=0.4",
  "einops>=0.7",
  "torchsde>=0.2.6",
  "tqdm>=4.66",
  "huggingface_hub>=0.20",
  "numpy<2",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest==7.2.0",
  "ruff>=0.5",
  "jupyter>=1.1",
  "pandas>=2.0",
]
scoring = [
  "hpsv2==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
