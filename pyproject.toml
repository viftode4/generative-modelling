[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-modelling-zigzag"
version = "0.1.0"
description = "Course project workspace for Zigzag Diffusion Sampling"
requires-python = ">=3.10,<3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "jupyter>=1.1",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
